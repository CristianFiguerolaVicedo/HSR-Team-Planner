# Local PostgreSQL for the backend: docker compose up -d
services:
  postgres:
    image: postgres:17
    # Starts again with Docker after a reboot, until you run "docker compose down"
    restart: unless-stopped
    environment:
      POSTGRES_DB: hsrplanner
      POSTGRES_USER: hsrplanner
      POSTGRES_PASSWORD: hsrplanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
