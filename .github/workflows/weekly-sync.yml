# Weekly catalog sync. The backend's own cron can't run while Render has it asleep,
# so GitHub wakes it up and calls the admin endpoint. HSRWiki refreshes on Wednesdays
# at 18:00 UTC; this runs at 19:30 UTC. Also runnable by hand (Actions → Weekly sync → Run workflow).
#
# Needs, in the repo's Settings → Secrets and variables → Actions:
#   variable PLANNER_API_URL   = https://hsr-team-planner-api.onrender.com   (the Render URL, not Vercel's)
#   secret   PLANNER_ADMIN_TOKEN = the ADMIN_TOKEN value from Render
name: Weekly sync

on:
  schedule:
    - cron: "30 19 * * 3"
  workflow_dispatch:

# Only calls the API with curl: the job's GitHub token needs no permissions at all
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake up the backend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "${{ vars.PLANNER_API_URL }}/api/health"; then echo; exit 0; fi
            echo "Not up yet ($i), waiting..."; sleep 10
          done
          echo "Backend did not wake up"; exit 1

      - name: Sync the catalog from HSRWiki
        env:
          TOKEN: ${{ secrets.PLANNER_ADMIN_TOKEN }}
        # HSRWiki is on Render too and may need its own minute to wake up
        # Prints what the server answered: 403 = wrong token, 503 = HSRWiki down, 409 = already running
        run: |
          if [ -z "$TOKEN" ]; then echo "Secret PLANNER_ADMIN_TOKEN is empty or missing"; exit 1; fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 900 -X POST \
            -H "X-Admin-Token: $TOKEN" "${{ vars.PLANNER_API_URL }}/api/admin/sync")
          cat response.json; echo
          if [ "$status" = "409" ]; then echo "A sync is already running on the server (e.g. after a deploy): nothing to do"; exit 0; fi
          if [ "$status" -ge 400 ]; then echo "Sync failed with HTTP $status"; exit 1; fi
